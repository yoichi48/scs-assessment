<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SCS★3 ギャップアセスメント</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,0.12)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--text:#e8e8e4;--text2:#9b9b97;--border:rgba(255,255,255,0.1)}}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
main{max-width:480px;width:100%;border:1px solid var(--border);border-radius:10px;padding:28px 24px}
h1{font-size:18px;margin-bottom:12px}
p{font-size:15px;color:var(--text2)}
p+p{margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>このページは終了しました</h1>
  <p>チャット形式のギャップアセスメントは、現在はご利用いただけません。</p>
  <p>担当者からご案内した、ワークベンチのリンクをご利用ください。ご不明な点は、担当者にお知らせください。</p>
</main>
</body>
</html>
